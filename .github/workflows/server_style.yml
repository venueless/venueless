name: Server style
on:
  push:
    branches: [ dev, stable, prod ]
    paths:
      - 'server/**'
  pull_request:
    branches: [ dev, stable, prod ]
    paths:
      - 'server/**'

jobs:
  black:
    name: black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv pip install --system black
        working-directory: ./server
      - name: Run checks
        run: black --check venueless tests
        working-directory: ./server
  flake8:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv pip install --system flake8
        working-directory: ./server
      - name: Run checks
        run: flake8 venueless tests
        working-directory: ./server
  isort:
    name: isort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv pip install --system isort
        working-directory: ./server
      - name: Run checks
        run: isort -c venueless tests
        working-directory: ./server
