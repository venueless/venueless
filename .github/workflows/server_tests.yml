name: Server tests
on:
  push:
    branches: [ dev, stable, prod ]
    paths:
      - 'server/**'
  pull_request:
    branches: [ dev, stable, prod ]
    paths:
      - 'server/**'
  workflow_dispatch: {}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    container: python:3.14
    strategy:
      fail-fast: false
    services:
      redis:
        image: redis:latest
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: venueless
          POSTGRES_DB: venueless
          POSTGRES_USER: venueless
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --locked --extra dev
        working-directory: ./server
      - name: Run checks
        run: uv run --no-sync python manage.py check
        working-directory: ./server
      - name: Run collectstatic
        run: uv run --no-sync python manage.py collectstatic
        working-directory: ./server
      - name: Run tests
        working-directory: ./server
        run: uv run --no-sync py.test tests/ --cov=./ --reruns 3 --reruns-delay 1
        env:
          VENUELESS_REDIS_HOST: 'redis'
          VENUELESS_DB_TYPE: 'postgresql'
          VENUELESS_DB_NAME: 'venueless'
          VENUELESS_DB_USER: 'venueless'
          VENUELESS_DB_PASS: 'venueless'
          VENUELESS_DB_HOST: 'postgres'

      - name: Build coverage info
        working-directory: ./server
        run: |
          uv run --no-sync python -m coverage json

          export TOTAL_COV=$(uv run --no-sync python -c "import json;print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
          echo "TOTAL_COV=$TOTAL_COV" >> $GITHUB_ENV
          echo "## Test coverage: $TOTAL_COV%" >> $GITHUB_STEP_SUMMARY
          uv run --no-sync python -m coverage report --skip-covered --skip-empty --show-missing --format=markdown >> $GITHUB_STEP_SUMMARY

          uv run --no-sync python -m coverage report --fail-under=70
