version: 2
updates:
  - package-ecosystem: npm
    directory: "/webapp"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      webapp-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: uv
    directory: "/server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
